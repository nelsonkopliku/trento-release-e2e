name: OBS sync (e2e)

on:
  workflow_dispatch:
    inputs:
      target:
        description: OBS project to sync, factory or stable.
        type: choice
        options: [factory, stable]
        default: factory
      source_ref:
        description: Commit, branch or tag to sync the container folder from. Empty means the dispatched commit.
        type: string
        default: ""
      update_changelog:
        description: Update the RPM changelog, as in a release.
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  obs-sync:
    name: OBS sync
    uses: nelsonkopliku/trento-dot-github/.github/workflows/obs-sync.yaml@e2e/commit-tree
    with:
      obs_project: ${{ inputs.target == 'stable' && 'home:nkopliku:trento:e2e:stable' || 'home:nkopliku:trento:e2e:factory' }}
      obs_package: supportutils-plugin-trento
      obs_image_package: trento-web-image
      source_ref: ${{ inputs.source_ref }}
      update_changelog: ${{ inputs.update_changelog }}
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      obs_user: ${{ secrets.OBS_USER }}
      obs_pass: ${{ secrets.OBS_PASS }}
      obs_ssh_key: ${{ secrets.OBS_SSH_KEY }}
